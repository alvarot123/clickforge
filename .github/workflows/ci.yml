name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall .

      - name: Smoke import application modules
        if: runner.os != 'Linux'
        run: python -c "import main; import core.clicker; import core.settings; import ui.mainwindow; print('imports-ok')"

      - name: Smoke import non-GUI modules on Linux
        if: runner.os == 'Linux'
        run: python -c "import app_meta; import core.clicker; import core.settings; print('imports-ok')"
